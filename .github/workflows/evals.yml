name: Claude evals

# Runs Claude against the eval cases in plugins/simple-progress-bars/evals.
# Each run costs API credit, so it runs only when started by hand.
# It needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: '3'

jobs:
  evals:
    name: Claude evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Claude Code confines the Bash tool with bubblewrap and socat on Linux.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - run: npm install -g @anthropic-ai/claude-code
      - run: >
          claude plugin eval plugins/simple-progress-bars
          --runs ${{ inputs.runs }} --ablation none --scaffold --trust-plugin
          --allow-tools Bash Write Edit -j 4 --no-publish
          --report evals-report.html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals-report.html
