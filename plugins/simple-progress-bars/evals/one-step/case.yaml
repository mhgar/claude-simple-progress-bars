schema_version: "1.1"
name: one-step
description: One step of about 4 seconds that cannot be measured runs through the wrapper with a text status, without being asked.
tags: [bash, use]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob]
  prompt: |
    Build the project with ./build.sh and tell me if it worked.
graders:
  - name: uses-the-wrapper
    type: tool_used
    tool: Bash
    input_match: 'claude-progress'
  - name: prints-a-status
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*\[progress(?::[^\]]*)?\] '
