schema_version: "1.1"
name: existing-script-fix
description: A bug fix in the user's own long script does not add progress reports unasked.
tags: [write, avoid]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Edit, Read, Glob]
  prompt: |
    backup.sh breaks on photo names with spaces. Fix that bug. Only edit the file.
graders:
  - name: no-progress-added
    type: regex
    target: { source: file, path: backup.sh }
    pattern: 'claude-progress'
    match: not_contains
