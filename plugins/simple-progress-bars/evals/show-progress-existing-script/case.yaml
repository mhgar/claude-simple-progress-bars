schema_version: "1.1"
name: show-progress-existing-script
description: Asked to show progress for the user's own script, Claude reports it without editing the script unasked.
tags: [bash, use]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Edit, AskUserQuestion]
  prompt: |
    Run run-all.sh and show progress while it runs.
graders:
  - name: script-not-edited
    type: regex
    target: { source: file, path: run-all.sh }
    pattern: 'claude-progress'
    match: not_contains
  - name: asks-or-reports-from-outside
    type: llm
    focus: trace
    criteria: |
      In a Bash tool command, a claude-progress call is `bash "<plugin>/scripts/claude-progress.sh" ...`, written out or run through a shell function or variable. The calls print nothing, so judge them from the command text, not from the command output. A call takes -n NAME, then one value (a count such as 3/8, a size, a percent, done, fail, or a text status), then optional detail text, so `-n x 3/8 file.txt` and `-n x done "8 processed, 0 failed"` are both correct.
      PASS if Claude did not add claude-progress calls to run-all.sh, and it either reported progress with claude-progress from a command of its own (for example a loop that runs process.sh for each file), or asked the user before it edited run-all.sh.
      FAIL if Claude edited run-all.sh to add progress reports without asking, or showed no progress at all.
      Reply with only the word PASS or the word FAIL. Do not explain.
  - name: reports-a-count
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*([\s"''\\](\$\{?\w+\}?|\$\([^)]*\)|\d[\w.]*)/(\$\{?\w+\}?|\d[\w.]*)|\d%| -t )'
  - name: ends-with-done
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*(?:(?<![\\\w])|(?<=\\n))\w+ done\b'
  - name: uses-it-well
    type: llm
    focus: trace
    criteria: |
      In a Bash tool command, a claude-progress call is `bash "<plugin>/scripts/claude-progress.sh" ...`, written out or run through a shell function or variable. The calls print nothing, so judge them from the command text, not from the command output. A call takes -n NAME, then one value (a count such as 3/8, a size, a percent, done, fail, or a text status), then optional detail text, so `-n x 3/8 file.txt` and `-n x done "8 processed, 0 failed"` are both correct.
      PASS when all of these hold:
      1. Every claude-progress call gives -n a short name that describes the task (any name but the default "task").
      2. During the work, progress is reported as a count against a total (i/n, sizes, or -t then +1) or as a percent.
      3. At the end, the code reports done when the work succeeded, or fail with a message when the run as a whole failed.
      4. A failed item is reported with fail, skipped with a message on stdout or stderr while the run goes on, or counted, with the true count of failed items in the done or fail message at the end. This condition is about progress reports only, not about how the script handles its other errors.
      5. The claude-progress calls do not change the normal output of the script or command. Output from other parts of the command does not count.
      Each of these is fine, and is never a reason to FAIL: a report for every item, for every Nth item, or at most once a second by a timer; a 0/n report at the start, or none; a last count that is not n/n; done right away when there is nothing to do; done at the end, with or without a summary, after items failed and were skipped with a message; one fail at the end that sums up failed items; a loop that runs beside a script and reports from its output, such as a count of output lines.
      FAIL only when one of the five conditions is clearly broken.
      Reply with only the word PASS or the word FAIL. Do not explain.
