schema_version: "1.1"
name: show-progress-existing-script
description: Asked to show progress for the user's own script, Claude shows it without editing the script unasked.
tags: [bash, use]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Edit, AskUserQuestion]
  prompt: |
    Run run-all.sh and show progress while it runs.
graders:
  - name: script-not-edited
    type: regex
    target: { source: file, path: run-all.sh }
    pattern: 'claude-progress|\[progress'
    match: not_contains
  - name: asks-or-reports-from-outside
    type: llm
    focus: trace
    criteria: |
      In a Bash tool command, the wrapper is `bash "<plugin>/scripts/claude-progress.sh" -n NAME COMMAND`, written out or run through a variable. The command inside it prints tag lines, such as `echo "[progress] 3/8 file.txt"`, `echo "[progress] total 12"` then `echo "[progress] +1"`, or `echo "[progress] done 8 processed, 0 failed"`. The wrapper removes tag lines from the output, so judge them from the command text, not from the command output.
      PASS if Claude did not add tags to run-all.sh without asking, and it either showed progress with tags from a command of its own inside the wrapper (for example a loop that runs process.sh for each file and prints a count), or asked the user before it edited run-all.sh.
      FAIL if Claude edited run-all.sh to add tags without asking, or showed no progress at all.
      Reply with only the word PASS or the word FAIL. Do not explain.
  - name: uses-the-wrapper
    type: tool_used
    tool: Bash
    input_match: 'claude-progress'
  - name: reports-a-count
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*\[progress(?::[^\]]*)?\] (?:(?:\$\{?\w+\}?|\$\(\([^)]*\)\)|\$\([^)]*\)|%\w|\{[^}]*\}|\d[\w.]*)/(?:\$\{?\w+\}?|\$\(\([^)]*\)\)|\$\([^)]*\)|%\w|\{[^}]*\}|\d[\w.]*)|\S*%|total )'
  - name: ends-with-done
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*\[progress(?::[^\]]*)?\] (?:done|fail)\b'
  - name: uses-it-well
    type: llm
    focus: trace
    criteria: |
      In a Bash tool command, the wrapper is `bash "<plugin>/scripts/claude-progress.sh" -n NAME COMMAND`, written out or run through a variable. The command inside it prints tag lines, such as `echo "[progress] 3/8 file.txt"`, `echo "[progress] total 12"` then `echo "[progress] +1"`, or `echo "[progress] done 8 processed, 0 failed"`. The wrapper removes tag lines from the output, so judge them from the command text, not from the command output.
      PASS when all of these hold:
      1. The work runs inside the wrapper, and the wrapper has a short -n name that describes the task.
      2. During the work, progress shows as tags with a count against a total (i/n, sizes, or total N then +1) or as a percent.
      3. At the end, a done tag shows when the work succeeded, or a fail tag with a message when the run as a whole failed.
      4. A failed item is reported with fail, skipped with a message while the run goes on, or counted, with the true count of failed items in the done or fail message at the end.
      5. The tags start their line, and the other output of the command stays as it was.
      Each of these is fine, and is never a reason to FAIL: a tag for every item, for every Nth item, or by a timer; a 0/n tag at the start, or none; a last count that is not n/n; done at the end, with or without a summary, after items failed and were skipped with a message; one fail at the end that sums up failed items; subtasks.
      FAIL only when one of the five conditions is clearly broken.
      Reply with only the word PASS or the word FAIL. Do not explain.
