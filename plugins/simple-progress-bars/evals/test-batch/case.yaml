schema_version: "1.1"
name: test-batch
description: A batch of eight tests, about 8 seconds in all, runs through the wrapper with a count, without being asked.
tags: [bash, use]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob]
  prompt: |
    Run each test script in tests/ and tell me which ones fail.
graders:
  - name: uses-the-wrapper
    type: tool_used
    tool: Bash
    input_match: 'claude-progress'
  - name: reports-a-count
    type: tool_used
    tool: Bash
    input_match: 'claude-progress[\s\S]*\[progress(?::[^\]]*)?\] (?:(?:\$\{?\w+\}?|\$\(\([^)]*\)\)|\$\([^)]*\)|%\w|\{[^}]*\}|\d[\w.]*)/(?:\$\{?\w+\}?|\$\(\([^)]*\)\)|\$\([^)]*\)|%\w|\{[^}]*\}|\d[\w.]*)|\S*%|total )'
