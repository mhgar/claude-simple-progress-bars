schema_version: "1.1"
name: other-languages
description: Python and PowerShell scripts for a long job get progress reports that cannot break them.
tags: [write, use]
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Write, Read, Glob]
  prompt: |
    Write two scripts for a long batch job that resizes every photo in a folder (often thousands) to at most 1600 pixels on the long side. resize.py uses Pillow. resize.ps1 does the same for Windows users with System.Drawing. Both take the folder as their argument. Only write the files.
graders:
  - name: reads-usage
    type: tool_used
    tool: Read
    input_match: 'USAGE\.md'
  - name: python-loads-the-twin
    type: regex
    target: { source: file, path: resize.py }
    pattern: 'CLAUDE_PROGRESS_DIR'
  - name: python-reports-a-count
    type: regex
    target: { source: file, path: resize.py }
    pattern: 'claude_progress\([^)]*/'
  - name: powershell-uses-the-twin
    type: regex
    target: { source: file, path: resize.ps1 }
    pattern: 'CLAUDE_PROGRESS_PS1'
  - name: python-uses-it-well
    type: llm
    focus: { source: file, path: resize.py }
    criteria: |
      PASS when all of these hold:
      1. Every claude-progress call gives -n a short name that describes the task (any name but the default "task").
      2. During the work, progress is reported as a count against a total (i/n, sizes, or -t then +1) or as a percent.
      3. At the end, the code reports done when the work succeeded, or fail with a message when the run as a whole failed.
      4. A failed item is reported with fail, or skipped with a message while the run goes on.
      5. The claude-progress calls do not change the normal output of the script or command.
      These are allowed: done right away when there is nothing to do; done with a summary when some items failed and were skipped; one fail at the end that sums up failed items; a report for every item, for every Nth item, or at most once a second by a timer; a 0/n report at the start.
      FAIL only when one of the five conditions is clearly broken. Name the condition.
  - name: powershell-uses-it-well
    type: llm
    focus: { source: file, path: resize.ps1 }
    criteria: |
      PASS when all of these hold:
      1. Every claude-progress call gives -n a short name that describes the task (any name but the default "task").
      2. During the work, progress is reported as a count against a total (i/n, sizes, or -t then +1) or as a percent.
      3. At the end, the code reports done when the work succeeded, or fail with a message when the run as a whole failed.
      4. A failed item is reported with fail, or skipped with a message while the run goes on.
      5. The claude-progress calls do not change the normal output of the script or command.
      These are allowed: done right away when there is nothing to do; done with a summary when some items failed and were skipped; one fail at the end that sums up failed items; a report for every item, for every Nth item, or at most once a second by a timer; a 0/n report at the start.
      FAIL only when one of the five conditions is clearly broken. Name the condition.
