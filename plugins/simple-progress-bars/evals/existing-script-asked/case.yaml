schema_version: "1.1"
name: existing-script-asked
description: When the user asks for progress in their own script, Claude adds it without asking again.
tags: [write, use]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Edit, Read, Glob, AskUserQuestion]
  prompt: |
    Add a progress bar to backup.sh. Only edit the file.
graders:
  - name: reports-progress
    type: regex
    target: { source: file, path: backup.sh }
    pattern: 'claude-progress -n'
  - name: has-shim
    type: regex
    target: { source: file, path: backup.sh }
    pattern: 'CLAUDE_PROGRESS_SH'
  - name: does-not-ask-again
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: reports-a-count
    type: regex
    target: { source: file, path: backup.sh }
    pattern: 'claude-progress -n \S+ (\S*/|-t |\S*%)'
  - name: ends-with-done
    type: regex
    target: { source: file, path: backup.sh }
    pattern: 'claude-progress -n \S+ done'
  - name: uses-it-well
    type: llm
    focus: { source: file, path: backup.sh }
    criteria: |
      PASS when all of these hold:
      1. Every claude-progress call gives -n a short name that describes the task (any name but the default "task").
      2. During the work, progress is reported as a count against a total (i/n, sizes, or -t then +1) or as a percent.
      3. At the end, the code reports done when the work succeeded, or fail with a message when the run as a whole failed.
      4. A failed item is reported with fail, or skipped with a message while the run goes on.
      5. The claude-progress calls do not change the normal output of the script or command.
      These are allowed: done right away when there is nothing to do; done with a summary when some items failed and were skipped; one fail at the end that sums up failed items; a report for every item, for every Nth item, or at most once a second by a timer; a 0/n report at the start.
      FAIL only when one of the five conditions is clearly broken. Name the condition.
